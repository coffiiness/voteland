version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_USERNAME}/voteland-backend:latest
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
      - STORAGE_DATABASE_CORE_DB_URL=${STORAGE_DATABASE_CORE_DB_URL}
      - STORAGE_DATABASE_CORE_DB_USERNAME=${STORAGE_DATABASE_CORE_DB_USERNAME}
      - STORAGE_DATABASE_CORE_DB_PASSWORD=${STORAGE_DATABASE_CORE_DB_PASSWORD}
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./support/monitoring/src/main/resources/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus